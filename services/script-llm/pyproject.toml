[tool.poetry]
name = "msl-script-llm"
version = "1.0.0"
description = "MeowShadow Lab Script-LLM Worker - Multi-tag Syntax Parser & Ollama Qwen 3 8B NLP Pipeline"
authors = ["MeowShadow Lab Team"]
readme = "README.md"
packages = [{include = "src"}]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = ">=0.110.0,<0.112.0"
uvicorn = {extras = ["standard"], version = ">=0.28.0,<0.31.0"}
pydantic = ">=2.6.0,<3.0.0"
pydantic-settings = ">=2.2.0,<3.0.0"
httpx = ">=0.27.0,<0.28.0"
redis = ">=5.0.0,<6.0.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0.0,<8.4.0"
pytest-asyncio = ">=0.23.0,<0.25.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
