[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "meowshadow-audio-processor"
version = "1.0.0"
description = "MeowShadow Lab - Audio Processor & Pacing Engine"
authors = [{ name = "MeowShadow Team" }]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "pydub>=0.25.1",
    "redis>=5.0.0",
    "numpy>=1.26.0",
    "scipy>=1.12.0",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --tb=short"
asyncio_default_fixture_loop_scope = "function"
